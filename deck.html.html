<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>르모니 · 10초 행동 덱</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
:root{
  --bg:#F7F6F4; --card:#FFFFFF; --ink:#18181B; --muted:#6F6E6A;
  --line:#E4E3DE; --line-soft:#EFEEEA;
  --accent:#7A4E63; --accent-bg:#F3EDF0; --accent-ink:#5E3A4B;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#1A1A1C; --card:#232326; --ink:#ECECEE; --muted:#9C9B97;
    --line:#333336; --line-soft:#2B2B2E;
    --accent:#C99BB0; --accent-bg:#2E2329; --accent-ink:#E2BECE;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1A1C; --card:#232326; --ink:#ECECEE; --muted:#9C9B97;
  --line:#333336; --line-soft:#2B2B2E;
  --accent:#C99BB0; --accent-bg:#2E2329; --accent-ink:#E2BECE;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center; padding:20px 16px 28px;
}
.wrap{width:100%; max-width:520px}

.step{margin-bottom:22px}
.step.hidden{display:none}
.q{font-size:14px; color:var(--muted); margin:0 0 10px}

.chips{display:flex; flex-wrap:wrap; gap:8px}
button{font:inherit; color:inherit; cursor:pointer}
.chip{
  background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:9px 16px; font-size:15px; transition:border-color .15s, color .15s;
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.on{border-color:var(--accent); border-width:1.5px; color:var(--accent); font-weight:500}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.big{padding:16px 18px; text-align:left; flex:1 1 150px}
.big .t{font-size:17px; font-weight:600; display:block; margin-bottom:3px}
.big .s{font-size:13px; color:var(--muted); display:block; font-weight:400}

.card{
  background:var(--card); border-radius:16px; padding:30px 24px;
  text-align:center; border:1px solid var(--line);
}
.card .cond{font-size:12px; color:var(--muted); margin:0 0 14px; letter-spacing:.01em}
.card .act{font-size:21px; font-weight:600; line-height:1.5; margin:0 0 16px; letter-spacing:-.01em}
.card .why{
  font-size:14px; color:var(--muted); line-height:1.8; margin:0;
  border-top:1px solid var(--line-soft); padding-top:15px; text-align:left;
}
.card.flip{animation:flip .35s ease-out}
@keyframes flip{
  from{opacity:0; transform:translateY(6px) scale(.985)}
  to{opacity:1; transform:none}
}
@media (prefers-reduced-motion: reduce){ .card.flip{animation:none} }

.acts{display:flex; gap:8px; margin-top:12px}
.acts button{
  flex:1; background:var(--card); border:1px solid var(--line);
  border-radius:9px; padding:12px; font-size:15px;
}
.acts button:hover{border-color:var(--accent); color:var(--accent)}
.acts .primary{background:var(--accent-bg); border-color:var(--accent-bg); color:var(--accent-ink); font-weight:500}

.done{
  background:var(--accent-bg); color:var(--accent-ink); border-radius:16px;
  padding:34px 24px; text-align:center;
}
.done p{margin:0 0 6px; font-size:19px; font-weight:600}
.done span{font-size:14px; opacity:.85}

.back{
  background:none; border:none; padding:10px 0 0; font-size:14px; color:var(--muted);
}
.back:hover{color:var(--accent)}

footer{
  margin-top:26px; padding-top:16px; border-top:1px solid var(--line-soft);
  font-size:12.5px; color:var(--muted); line-height:1.8;
}
footer p{margin:0 0 4px}
</style>
</head>
<body>
<div class="wrap">

  <div class="step" id="s1">
    <p class="q">지금 뭐 때문에 힘들어요?</p>
    <div class="chips">
      <button class="chip big" data-branch="감정"><span class="t">감정 때문에</span><span class="s">예민함, 불안, 가라앉음</span></button>
      <button class="chip big" data-branch="증상"><span class="t">증상 때문에</span><span class="s">통증, 두통, 붓기, 피로</span></button>
    </div>
  </div>

  <div class="step hidden" id="s2">
    <p class="q" id="q2">어떤 쪽인가요?</p>
    <div class="chips" id="items"></div>
    <button class="back" id="back1">← 처음으로</button>
  </div>

  <div class="step hidden" id="s3">
    <div class="card" id="card">
      <p class="cond" id="cond"></p>
      <p class="act" id="act"></p>
      <p class="why" id="why"></p>
    </div>
    <div class="acts">
      <button id="redraw">다시 뽑기</button>
      <button id="did" class="primary">했어요</button>
    </div>
    <button class="back" id="back2">← 처음으로</button>
  </div>

  <div class="step hidden" id="s4">
    <div class="done">
      <p>하나 했어요</p>
      <span>그거면 오늘은 충분해요</span>
    </div>
    <button class="back" id="back3">← 처음으로</button>
  </div>

  <footer>
    <p>증상이 심하거나 평소와 다르면 병원에서 확인해 보세요.</p>
    <p>가라앉은 기분이 2주 넘게 이어지거나 일상이 힘들 정도면 전문가와 상담해 보세요.</p>
  </footer>

</div>

<script>
const DECK = {
  "감정": {
    "긴장": [
      ["숨을 4초 들이쉬고 6초 내쉬기, 세 번", "내쉬는 숨이 길어야 몸이 진정 신호로 받아요. 들이쉬는 것보다 내쉬는 게 길면 돼요."],
      ["어깨를 귀까지 올렸다가 툭 떨어뜨리기, 다섯 번", "긴장은 어깨와 턱에 먼저 쌓여요. 힘을 줬다 빼야 풀린 게 느껴져요."],
      ["손을 따뜻한 물에 30초 담그기", "손끝이 차가우면 잘 안 풀려요. 순서를 바꿔서 몸부터 데워보는 거예요."],
      ["지금 걱정되는 걸 한 문장으로 적기", "머릿속에 떠 있을 때가 제일 커 보여요. 글자로 나오면 크기가 정해져요."]
    ],
    "예민": [
      ["답장을 쓰다 말고 10분 뒤에 다시 읽기", "같은 말이 평소보다 날카롭게 들리는 날이 있어요. 지금 느낌이 틀린 게 아니라, 10분 뒤에도 같은지 보는 거예요."],
      ["이어폰 끼고 소리 덮기", "예민할 땐 소리 자극이 제일 크게 들어와요. 자극 하나만 줄여도 달라져요."],
      ["제일 거슬리는 것 하나만 치우기", "전부 정리하려 들면 더 예민해져요. 눈에 보이는 하나면 돼요."],
      ["물 한 컵 천천히 마시기", "반응하기 전에 20초를 벌어주는 행동이에요. 그 20초가 대부분을 막아줘요."]
    ],
    "불안": [
      ["지금 보이는 것 다섯 개를 소리 내어 세기", "불안은 아직 안 일어난 일에 가 있어요. 감각을 쓰면 지금으로 돌아와요."],
      ["발바닥이 바닥에 닿는 느낌에 30초 집중하기", "생각을 멈추려 하면 더 커져요. 주의를 둘 다른 자리를 주는 거예요."],
      ["걱정을 \"그래서 지금 할 수 있는 건?\"으로 바꿔 적기", "답이 없다면 지금 다룰 일이 아니라는 뜻이에요."],
      ["창문 열고 찬 공기 30초 쐬기", "온도가 바뀌면 주의가 따라와요. 밖에 안 나가도 돼요."]
    ],
    "무기력": [
      ["2분만 하고 그만둔다고 정하고 시작하기", "의욕은 시작 전이 아니라 시작한 뒤에 와요. 2분 뒤에 진짜 그만둬도 돼요."],
      ["일어나서 한 바퀴 걷기", "몸이 멈춰 있으면 마음도 안 움직여요. 순서를 거꾸로 해보는 거예요."],
      ["커튼 열고 밝은 빛 보기", "빛은 몸의 하루 리듬을 깨우는 신호예요. 흐린 날 창가도 실내 조명보다 밝아요."],
      ["오늘 할 일에서 제일 작은 것 하나만 남기기", "무기력할 땐 목록 자체가 무거워요. 하나만 남기면 가벼워져요."]
    ],
    "우울": [
      ["지금 기분에 이름 붙여 한 줄 적기", "뭉뚱그려진 감정은 더 무거워요. 이름이 붙으면 다룰 수 있는 크기가 돼요."],
      ["따뜻한 걸 손에 쥐고 3분 있기", "온기는 기분과 같이 움직이는 감각이에요. 컵이든 뭐든 돼요."],
      ["아무한테나 짧게 한 마디 보내기", "가라앉을 땐 혼자가 되는 쪽으로 움직이게 돼요. 반대로 한 걸음만요."],
      ["오늘 한 일 중 하나만 적기", "아무것도 못 했다고 느껴지는 날이 있어요. 실제로는 뭐라도 했어요."]
    ]
  },
  "증상": {
    "생리통": [
      ["배에 따뜻한 걸 올리고 5분 눕기", "온기는 이럴 때 가장 흔히 쓰는 방법이에요. 뜨겁지 않게, 따뜻한 정도면 돼요."],
      ["무릎을 가슴 쪽으로 당기고 30초", "배 쪽이 늘어나면 당기는 느낌이 덜해져요. 옆으로 누워서 해도 돼요."],
      ["조이는 옷이나 허리띠 풀기", "배를 누르는 게 있으면 더 크게 느껴져요. 제일 빨리 할 수 있는 거예요."],
      ["오늘 약속 하나 미루기", "참고 나가면 하루가 다 무너져요. 하나만 빼도 나머지가 버텨져요."]
    ],
    "허리·골반 통증": [
      ["벽에 등 대고 무릎 살짝 굽혀 30초 서 있기", "굽은 채로 오래 있으면 더 뻐근해져요. 펴는 자세를 잠깐 주는 거예요."],
      ["누워서 무릎 세우고 좌우로 천천히 넘기기, 열 번", "골반 주변이 뭉치면 움직임부터 줄어요. 크게 안 해도 돼요."],
      ["엉덩이 밑에 손 넣어 좌우 무게 확인하기", "한쪽으로 쏠려 앉는 게 원인일 때가 많아요. 확인만 해도 자세가 바뀌어요."],
      ["따뜻한 것을 허리 아래에 30초 대기", "배보다 허리 쪽이 더 편할 때도 있어요. 어디가 나은지는 사람마다 달라요."]
    ],
    "두통": [
      ["불 끄거나 화면 밝기 낮추기", "빛 자극이 키우는 경우가 많아요. 제일 먼저 줄일 수 있는 자극이에요."],
      ["물 한 컵 마시기", "수분이 모자랄 때 머리가 먼저 신호를 보내기도 해요. 손해 볼 일은 없어요."],
      ["관자놀이와 목뒤를 손끝으로 10초씩 누르기", "목 뒤가 뭉치면 머리까지 당겨요. 세게 말고 가볍게요."],
      ["오늘 카페인 몇 잔인지 세어보기", "너무 많아도, 평소보다 적어도 머리가 아플 수 있어요. 적어두면 다음 주기에 보여요."]
    ],
    "붓기": [
      ["다리를 벽에 올리고 2분", "아래로 몰린 게 돌아오는 자세예요. 누울 데만 있으면 돼요."],
      ["발목 열 번 돌리기", "앉아서도 돼요. 앉아 있는 시간이 길수록 도움이 커요."],
      ["오늘 물을 얼마나 마셨는지 세어보기", "붓는다고 물을 줄이면 반대로 갈 때가 많아요. 확인부터요."],
      ["양말이나 옷 자국 확인하기", "자국이 깊으면 오늘은 헐렁한 걸로 바꾸라는 신호예요."]
    ],
    "졸림·피로": [
      ["3분만 눈 감고 앉아 있기", "자지 않아도 돼요. 눈 감는 것만으로 들어오는 정보가 확 줄어요."],
      ["일어나서 창가로 가기", "빛이 졸음 신호를 눌러줘요. 커피보다 빠를 때도 있어요."],
      ["지금부터 카페인 안 마시기로 정하기", "오후 카페인은 밤잠을 깎고, 그게 내일 피로로 돌아와요."],
      ["오늘 밤 30분 일찍 눕기로 정하고 알람 맞추기", "피곤할 때 정해둬야 밤에 안 밀려요."]
    ],
    "속 불편함": [
      ["허리 펴고 5분 앉아 있기", "굽힌 자세는 배를 눌러요. 누워 있는 것보다 나을 때가 많아요."],
      ["따뜻한 물 반 컵 천천히 마시기", "찬 것보다 속이 편할 때가 많아요. 천천히가 중요해요."],
      ["배를 시계 방향으로 30초 쓸어주기", "세게 누르지 말고 손바닥으로 가볍게요."],
      ["마지막으로 먹은 게 뭐였는지 적어두기", "주기마다 같은 게 걸리는지 보려면 기록이 있어야 해요."]
    ]
  }
};

const $ = id => document.getElementById(id);
const steps = ["s1","s2","s3","s4"];
let branch = null, item = null;

function show(id){
  steps.forEach(s => $(s).classList.toggle("hidden", s !== id));
}

function recentKey(b, i){ return "lemoni:recent:" + b + ":" + i; }

function getRecent(b, i){
  try {
    const raw = localStorage.getItem(recentKey(b, i));
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function pushRecent(b, i, idx){
  try {
    const list = getRecent(b, i);
    list.push(idx);
    while (list.length > 2) list.shift();
    localStorage.setItem(recentKey(b, i), JSON.stringify(list));
  } catch (e) { /* 저장이 막혀 있어도 뽑기는 그대로 돌아갑니다 */ }
}

function draw(){
  const cards = DECK[branch][item];
  const recent = getRecent(branch, item);
  let pool = cards.map((_, i) => i).filter(i => !recent.includes(i));
  if (pool.length === 0) pool = cards.map((_, i) => i);
  const idx = pool[Math.floor(Math.random() * pool.length)];
  pushRecent(branch, item, idx);

  $("cond").textContent = branch + " · " + item + " · " + cards.length + "장 중 1장";
  $("act").textContent = cards[idx][0];
  $("why").textContent = cards[idx][1];

  const c = $("card");
  c.classList.remove("flip");
  void c.offsetWidth;
  c.classList.add("flip");
}

function renderItems(){
  const box = $("items");
  box.innerHTML = "";
  Object.keys(DECK[branch]).forEach(name => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = name;
    b.addEventListener("click", () => {
      item = name;
      [...box.children].forEach(el => el.classList.toggle("on", el === b));
      draw();
      show("s3");
    });
    box.appendChild(b);
  });
}

document.querySelectorAll("[data-branch]").forEach(btn => {
  btn.addEventListener("click", () => {
    branch = btn.dataset.branch;
    $("q2").textContent = branch === "감정" ? "어떤 감정인가요?" : "어떤 증상인가요?";
    renderItems();
    show("s2");
  });
});

$("redraw").addEventListener("click", draw);
$("did").addEventListener("click", () => show("s4"));
["back1","back2","back3"].forEach(id => {
  $(id).addEventListener("click", () => { branch = null; item = null; show("s1"); });
});
</script>
</body>
</html>
